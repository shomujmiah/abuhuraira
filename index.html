<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Abu Huraira Masjid</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Abu Huraira Masjid">
  <link rel="icon" type="image/png" href="icon-192.png">

  <!-- OneSignal SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    window.OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "f7f7a2a5-6569-479c-b91d-48b29410590f",
        path: "/abuhuraira/"
      });

      checkNotificationPermission(OneSignal);

      OneSignal.Notifications.addEventListener('permissionChange', function(permission) {
        if (permission) {
          hideAlertButton();
        }
      });
    });

    // Listen for incoming postMessages from the Google Apps Script iframe web app
    window.addEventListener('message', function(event) {
        if (event.data && event.data.type === 'UPDATE_ONESIGNAL_TAGS') {
            const tagsObj = event.data.tags;
            window.OneSignalDeferred.push(async function(OneSignal) {
                try {
                    await OneSignal.User.addTags(tagsObj);
                    console.log("OneSignal Tags Successfully Updated:", tagsObj);
                } catch (err) {
                    console.error("Failed to update OneSignal tags:", err);
                }
            });
        }
    });

    function checkNotificationPermission(OneSignal) {
      if (OneSignal.Notifications.permission) {
        hideAlertButton();
      }
    }

    function hideAlertButton() {
      const btn = document.getElementById('enableAlertsBtn');
      if (btn) {
        btn.style.display = 'none';
      }
    }

    function triggerPushPrompt() {
      window.OneSignalDeferred.push(async function(OneSignal) {
        try {
          const permission = await OneSignal.Notifications.requestPermission();
          if (permission) {
            hideAlertButton();
          }
        } catch (err) {
          console.error("OneSignal Prompt Error:", err);
          alert("Prompt failed: " + (err.message || err));
        }
      });
    }
  </script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0f172a; }
    
    /* Floating bell button on the outer wrapper so it's always accessible */
    .floating-bell {
      position: fixed; top: 12px; right: 12px; z-index: 99999;
      background: #9333ea; color: white; border: none; padding: 8px 14px;
      border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      transition: opacity 0.3s ease;
    }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <!-- Native button on the outer wrapper that bypasses iframe restrictions -->
  <button id="enableAlertsBtn" class="floating-bell" onclick="triggerPushPrompt()">🔔 Enable Alerts</button>

  <iframe src="https://script.google.com/macros/s/AKfycbwXb38jVqF3J6sX3oR9nsv_NUVH3K4G_vky8cHWFVgppv0rpTn7KnQBLG9T8wRgfeIx/exec" allow="push"></iframe>
</body>
</html>

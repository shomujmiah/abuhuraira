<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Abu Huraira Masjid</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Abu Huraira Masjid">
  <link rel="icon" type="image/png" href="icon-192.png">

  <!-- OneSignal SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    window.OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "f7f7a2a5-6569-479c-b91d-48b29410590f",
        path: "/abuhuraira/"
      });
    });

    async function enablePush() {
      if (window.OneSignal) {
        try {
          await OneSignal.Slidedown.promptPush();
        } catch (err) {
          console.error("Prompt error:", err);
        }
      } else {
        alert("Notification service is loading, please try again.");
      }
    }
  </script>

  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0f172a; }
    
    /* Floating bell button on the outer wrapper so it's always accessible */
    .floating-bell {
      position: fixed; top: 12px; right: 12px; z-index: 99999;
      background: #9333ea; color: white; border: none; padding: 8px 14px;
      border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <!-- Native button on the outer wrapper that bypasses iframe restrictions -->
  <button class="floating-bell" onclick="enablePush()">🔔 Enable Alerts</button>

  <iframe src="https://script.google.com/macros/s/AKfycbwXb38jVqF3J6sX3oR9nsv_NUVH3K4G_vky8cHWFVgppv0rpTn7KnQBLG9T8wRgfeIx/exec" allow="push"></iframe>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Abu Huraira Masjid</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Abu Huraira Masjid">
  <link rel="icon" type="image/png" href="icon-192.png">

  <!-- OneSignal Web SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    window.OneSignalDeferred.push(async function(OneSignal) {
      try {
        await OneSignal.init({
          appId: "f7f7a2a5-6569-479c-b91d-48b29410590f"
        });
        window.isOneSignalLoaded = true;
        console.log("OneSignal initialized successfully");
      } catch (err) {
        console.error("OneSignal init error:", err);
      }
    });

    async function subscribePush() {
      if (window.isOneSignalLoaded || window.OneSignal) {
        try {
          await OneSignal.Slidedown.promptPush();
        } catch (err) {
          console.error("Error prompting push:", err);
          alert("Error opening notification prompt. Make sure you are running from the Home Screen PWA.");
        }
      } else {
        alert("OneSignal is still loading or blocked. Please check your internet connection or restart the app.");
      }
    }
  </script>

  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .notif-banner {
      position: fixed; top: 10px; right: 10px; z-index: 10000;
      background: rgba(168, 85, 247, 0.9); color: white; border: none;
      padding: 8px 12px; border-radius: 20px; font-size: 12px; font-weight: bold;
      cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); backdrop-filter: blur(5px);
    }
    iframe {
      width: 100%; height: 100%; border: none; display: block;
    }
  </style>
</head>
<body>
  <!-- Floating button to force the iOS notification prompt -->
  <button class="notif-banner" onclick="subscribePush()">🔔 Enable Alerts</button>

  <iframe src="https://script.google.com/macros/s/AKfycbwXb38jVqF3J6sX3oR9nsv_NUVH3K4G_vky8cHWFVgppv0rpTn7KnQBLG9T8wRgfeIx/exec"></iframe>
</body>
</html>
